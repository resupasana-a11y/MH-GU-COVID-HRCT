[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resnet50v2-covid-hrct"
version = "1.0.0"
description = "ResNet50V2 research pipeline for binary COVID-19 CT image classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.15,<2.17",
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
    "Pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
